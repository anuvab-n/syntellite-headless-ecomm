# Local development dependencies only. The API/worker/scheduler run on the host via
# `pnpm dev` for fast reload; `docker compose --profile app up` runs them containerised
# to verify the image before a deploy.
name: ecom-backend

services:
  postgres:
    # Debian-based, NOT `-alpine`. Alpine/musl images fail to exec on some Docker Desktop
    # + WSL2 kernels ("accessing a corrupted shared library" — reproducible with a bare
    # `docker run alpine:3 echo ok`). Debian costs ~80MB more and starts everywhere.
    image: postgres:16
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports:
      # Non-default HOST port on purpose. 5432 is routinely taken by a native Postgres
      # install, and a collision there produces a confusing "port already allocated"
      # instead of an obvious one. Container-internal port stays 5432.
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # Surfaces slow queries during development rather than in production.
      - postgres
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecom -d ecom']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Also remapped: 6379 is commonly held by another project's Redis.
      - '56379:6379'
    # NOTE: one local instance backs all three logical DBs, so the eviction policy is
    # shared. Production MUST separate them — the lock DB requires `noeviction`.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket once, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ecom-media &&
      mc anonymous set download local/ecom-media
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  pgdata:
  miniodata:
